name: release
on:
  push:
    tags: ["v*"]
  workflow_dispatch: # builds the archives as workflow artifacts without publishing a release

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            archive: ayaz-macos-arm64.zip
          - os: windows-latest
            archive: ayaz-windows-amd64.zip
          - os: ubuntu-24.04
            archive: ayaz-linux-amd64.tar.gz
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: oven-sh/setup-bun@v2
      - uses: arduino/setup-task@v2
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - run: go install github.com/wailsapp/wails/v3/cmd/wails3@v3.1.0
      - name: Linux GUI libraries (Wails links GTK4/WebKitGTK)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-4-dev libwebkitgtk-6.0-dev
      # PACKAGE_MANAGER defaults to bun in the Taskfile.
      - name: Build
        run: task ${{ runner.os == 'macOS' && 'package' || 'build' }}

      - name: Archive (macOS)
        if: runner.os == 'macOS'
        run: ditto -c -k --keepParent bin/ayaz.app "${{ matrix.archive }}"
      - name: Archive (Windows)
        if: runner.os == 'Windows'
        run: 7z a "${{ matrix.archive }}" ./bin/ayaz.exe
      - name: Archive (Linux)
        if: runner.os == 'Linux'
        run: tar -czf "${{ matrix.archive }}" -C bin ayaz -C ../build/linux ayaz.desktop

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.archive }}
          path: ${{ matrix.archive }}
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Create the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes
