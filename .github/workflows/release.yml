name: release
on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag (e.g. v0.3.0)'
        required: false
        default: ''
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  test:
    name: Test Suite Pre-Check
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Linux GUI libraries (GTK4 / WebKitGTK for Wails)
        run: scripts/ci-apt.sh libgtk-4-dev libwebkitgtk-6.0-dev

      - name: Dist placeholder
        run: mkdir -p frontend/dist && touch frontend/dist/index.html

      - name: Go Unit Tests
        run: go test ./...

      - name: Frontend Tests & Typecheck
        working-directory: frontend
        run: |
          bun install --frozen-lockfile
          bun run typecheck
          bun run test

  build:
    name: Build (${{ matrix.os }})
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            archive: ayaz-macos-arm64.zip
          - os: windows-latest
            archive: ayaz-windows-amd64.zip
          - os: ubuntu-24.04
            archive: ayaz-linux-amd64.tar.gz
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - uses: oven-sh/setup-bun@v2

      - uses: arduino/setup-task@v2
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Linux GUI libraries (Wails links GTK4/WebKitGTK, the wails3 CLI too)
        if: runner.os == 'Linux'
        run: scripts/ci-apt.sh libgtk-4-dev libwebkitgtk-6.0-dev

      - run: go install github.com/wailsapp/wails/v3/cmd/wails3@v3.1.0

      # PACKAGE_MANAGER defaults to bun in the Taskfile.
      - name: Build
        run: task ${{ runner.os == 'macOS' && 'package' || 'build' }}

      - name: Archive (macOS)
        if: runner.os == 'macOS'
        run: ditto -c -k --keepParent bin/ayaz.app "${{ matrix.archive }}"

      - name: Archive (Windows)
        if: runner.os == 'Windows'
        run: 7z a "${{ matrix.archive }}" ./bin/ayaz.exe

      - name: Archive (Linux)
        if: runner.os == 'Linux'
        run: tar -czf "${{ matrix.archive }}" -C bin ayaz -C ../build/linux ayaz.desktop

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.archive }}
          path: ${{ matrix.archive }}
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.tag_name != '')
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Generate checksums
        run: |
          cd dist
          sha256sum * > SHA256SUMS
          cat SHA256SUMS
          cd ..

      - name: Create the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ inputs.tag_name || github.ref_name }}"
          gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --title "$TAG" --generate-notes
