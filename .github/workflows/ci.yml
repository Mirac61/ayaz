name: ci

on:
  pull_request:
    branches:
      - main
      - dev
  push:
    branches:
      - main
      - dev
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Lightweight Unit Tests (Go & Frontend)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Linux GUI libraries (GTK4 / WebKitGTK for Wails)
        run: scripts/ci-apt.sh libgtk-4-dev libwebkitgtk-6.0-dev

      # Embed placeholder so main package can compile without full frontend dist
      - name: Dist placeholder
        run: mkdir -p frontend/dist && touch frontend/dist/index.html

      - name: Go Lint & Format
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15.0

      - name: Go Unit Tests
        run: go test -race ./...

      - name: Go Vulnerability Check
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...

      - name: Frontend Tests & Typecheck
        working-directory: frontend
        run: |
          bun install --frozen-lockfile
          bun run typecheck
          bun run lint
          bun run test
