name: ci
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    name: Lightweight Unit Tests (Go & Frontend)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      # Embed placeholder so main package can compile without full frontend dist
      - name: Dist placeholder
        run: mkdir -p frontend/dist && touch frontend/dist/index.html

      - name: Go Unit Tests
        run: go test ./...

      - name: Frontend Tests & Typecheck
        working-directory: frontend
        run: |
          bun install --frozen-lockfile
          bun run typecheck
          bun run test
