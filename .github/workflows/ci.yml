name: ci

on:
  pull_request:
    branches:
      - main
      - dev
  push:
    branches:
      - main
      - dev
      - '**'
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag (leave empty for test-only run, or specify e.g. v0.4.0)'
        required: false
        default: ''

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  test:
    name: Lightweight Unit Tests (Go & Frontend)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Linux GUI libraries (GTK4 / WebKitGTK for Wails)
        run: scripts/ci-apt.sh libgtk-4-dev libwebkitgtk-6.0-dev

      # Embed placeholder so main package can compile without full frontend dist
      - name: Dist placeholder
        run: mkdir -p frontend/dist && touch frontend/dist/index.html

      - name: Go Unit Tests
        run: go test ./...

      - name: Frontend Tests & Typecheck
        working-directory: frontend
        run: |
          bun install --frozen-lockfile
          bun run typecheck
          bun run test

  build:
    name: Multi-Platform Build (${{ matrix.os }})
    needs: test
    # Run builds on main, tags, or manual workflow_dispatch (Feature branches/PRs stop at test)
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            archive: ayaz-macos-arm64.zip
          - os: windows-latest
            archive: ayaz-windows-amd64.zip
          - os: ubuntu-24.04
            archive: ayaz-linux-amd64.tar.gz
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Setup Task
        uses: arduino/setup-task@v2
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Linux GUI libraries (GTK4 / WebKitGTK for Wails)
        if: runner.os == 'Linux'
        run: scripts/ci-apt.sh libgtk-4-dev libwebkitgtk-6.0-dev

      - name: Install Wails3 CLI
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@v3.1.0

      - name: Build
        run: task ${{ runner.os == 'macOS' && 'package' || 'build' }}

      - name: Archive (macOS)
        if: runner.os == 'macOS' && (startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.tag_name != ''))
        run: COPYFILE_DISABLE=1 ditto -c -k --keepParent --norsrc bin/ayaz.app "${{ matrix.archive }}"

      - name: Archive (Windows)
        if: runner.os == 'Windows' && (startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.tag_name != ''))
        run: 7z a "${{ matrix.archive }}" ./bin/ayaz.exe

      - name: Archive (Linux)
        if: runner.os == 'Linux' && (startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.tag_name != ''))
        run: tar -czf "${{ matrix.archive }}" -C bin ayaz -C ../build/linux ayaz.desktop

      - name: Upload Artifact
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.tag_name != '')
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.archive }}
          path: ${{ matrix.archive }}
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: build
    # Only publish if this is a tag push or a manual dispatch with tag_name
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.tag_name != '')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Generate Checksums
        run: |
          cd dist
          sha256sum * > SHA256SUMS
          cat SHA256SUMS
          cd ..

      - name: Publish Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ inputs.tag_name || github.ref_name }}"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --title "$TAG" --generate-notes
          fi
