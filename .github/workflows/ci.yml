name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  go:
    strategy:
      matrix:
        os: [macos-latest, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Linux GUI libraries (Wails links GTK4/WebKitGTK)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-4-dev libwebkitgtk-6.0-dev
      # main embeds frontend/dist, which only exists after a frontend build.
      - run: mkdir -p frontend/dist && touch frontend/dist/index.html
      - run: go vet ./...
      - run: go test -race ./...
      - name: Fuzz the path jail
        if: runner.os == 'Linux'
        run: go test -run='^$' -fuzz=FuzzResolve -fuzztime=30s ./internal/workspace

  frontend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run test

  # Vitest browser mode and Playwright E2E, both in WebKit. E2E runs against the server build, with a real gopls
  # (the LSP tests skip without one). On macOS too: that is the platform the app is for.
  browser:
    strategy:
      matrix:
        os: [ubuntu-24.04, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
        working-directory: frontend
      - name: Playwright WebKit (Linux needs its system libraries too)
        run: bunx playwright install ${{ runner.os == 'Linux' && '--with-deps' || '' }} webkit
        working-directory: frontend
      - run: bun run test:browser
        working-directory: frontend
      - run: bun run build
        working-directory: frontend
      # Wails 3.1.0 still links GTK/WebKitGTK in the server build on Linux.
      - name: Linux GUI libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-4-dev libwebkitgtk-6.0-dev
      - run: go install golang.org/x/tools/gopls@v0.24.0
      - run: echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - run: go build -tags server,production -o bin/ayaz-server .
      - run: bun run e2e
        working-directory: frontend
