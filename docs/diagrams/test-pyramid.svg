<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" role="img" aria-labelledby="t d">
  <title id="t">Test pyramid</title>
  <desc id="d">Five test layers from few and slow at the top to many and fast at the bottom: manual checks, E2E, browser tests, Node tests, Go tests. Node and Go run in CI.</desc>
  <style>
    :root { --ink:#1f2328; --mute:#59636e; --l1:#e8e8ec; --l2:#fbe3c8; --l3:#fcd9d9; --l4:#d6ecd9; --l5:#cfe6f7; --ci:#1a7f37; --you:#b35900; --hand:#59636e; }
    @media (prefers-color-scheme: dark) { :root { --ink:#e6edf3; --mute:#9198a1; --l1:#3a3d44; --l2:#5a4128; --l3:#5c2f33; --l4:#274a31; --l5:#24455f; --ci:#56d364; --you:#f0a050; --hand:#9198a1; } }
    text { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: var(--ink); }
    .name { font-size: 20px; font-weight: 700; }
    .sub { font-size: 14px; fill: var(--mute); }
    .ico { font-size: 26px; }
    .badge { font-size: 14px; font-weight: 700; }
    .ci { fill: var(--ci); } .you { fill: var(--you); } .hand { fill: var(--hand); }
    .axis { font-size: 13px; fill: var(--mute); }
  </style>

  <!-- layers, widening downwards -->
  <rect x="290" y="20"  width="320" height="76" rx="10" fill="var(--l1)"/>
  <rect x="240" y="104" width="420" height="76" rx="10" fill="var(--l2)"/>
  <rect x="190" y="188" width="520" height="76" rx="10" fill="var(--l3)"/>
  <rect x="140" y="272" width="620" height="76" rx="10" fill="var(--l4)"/>
  <rect x="90"  y="356" width="720" height="76" rx="10" fill="var(--l5)"/>

  <text class="ico" x="312" y="68">🖐️</text>
  <text class="name" x="352" y="52">Manual</text>
  <text class="sub"  x="352" y="75">window, dialogs, clipboard</text>

  <text class="ico" x="262" y="152">🌐</text>
  <text class="name" x="302" y="136">E2E</text>
  <text class="sub"  x="302" y="159">whole app, server build</text>

  <text class="ico" x="212" y="236">🧩</text>
  <text class="name" x="252" y="220">Browser tests</text>
  <text class="sub"  x="252" y="243">EditorView, xterm, pdf.js</text>

  <text class="ico" x="162" y="320">⚡</text>
  <text class="name" x="202" y="304">Node tests</text>
  <text class="sub"  x="202" y="327">pure logic, no DOM</text>

  <text class="ico" x="112" y="404">⚙️</text>
  <text class="name" x="152" y="388">Go tests</text>
  <text class="sub"  x="152" y="411">services, fuzzing, benchmarks</text>

  <!-- where it runs -->
  <text class="badge hand" x="930" y="64" text-anchor="end">by hand</text>
  <text class="badge you" x="930" y="148" text-anchor="end">you run it</text>
  <text class="badge you" x="930" y="232" text-anchor="end">you run it</text>
  <text class="badge ci" x="930" y="316" text-anchor="end">✓ in CI</text>
  <text class="badge ci" x="930" y="400" text-anchor="end">✓ in CI</text>

  <text class="axis" x="20" y="62">few, slow</text>
  <text class="axis" x="20" y="410">many, fast</text>
</svg>
