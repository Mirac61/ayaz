<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 472" role="img" aria-labelledby="t d">
  <title id="t">Test pyramid</title>
  <desc id="d">Five test layers as a pyramid, few and slow at the top, many and fast at the bottom. Green layers run in CI: Node tests and Go tests. Orange layers you run yourself: E2E and browser tests. Grey: manual checks.</desc>
  <style>
    :root { --ink:#1f2328; --mute:#59636e; --c-hand:#d0d4da; --c-you1:#f6c98a; --c-you2:#f1b25f; --c-ci1:#8fd19e; --c-ci2:#5fbf78; --ci:#1a7f37; --you:#b35900; --hand:#59636e; }
    @media (prefers-color-scheme: dark) { :root { --ink:#f0f3f6; --mute:#9198a1; --c-hand:#454a53; --c-you1:#8a6030; --c-you2:#a36d28; --c-ci1:#2f6a42; --c-ci2:#25804a; --ci:#56d364; --you:#f0a050; --hand:#9198a1; } }
    text { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: var(--ink); }
    .in { font-size: 17px; font-weight: 700; text-anchor: middle; }
    .insub { font-size: 13px; text-anchor: middle; }
    .badge { font-size: 16px; font-weight: 700; }
    .cmd { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; font-size: 13px; fill: var(--mute); }
    .ci { fill: var(--ci); } .you { fill: var(--you); } .hand { fill: var(--hand); }
    .axis { font-size: 13px; fill: var(--mute); }
    .lead { stroke: var(--mute); stroke-width: 1; stroke-dasharray: 2 4; opacity: .55; }
  </style>

  <polygon points="300.0,20 300.0,20 355.2,100 244.8,100" fill="var(--c-hand)"/>
  <text class="in" x="300" y="86">Manual</text>
  <line class="lead" x1="337.6" y1="60" x2="636" y2="60"/>
  <text class="badge hand" x="652" y="57">by hand</text>
  <text class="cmd" x="652" y="77">docs/07-manual-checks.md</text>
  <polygon points="242.0,104 358.0,104 413.2,184 186.8,184" fill="var(--c-you1)"/>
  <text class="in" x="300" y="144">E2E</text>
  <text class="insub" x="300" y="164">whole app</text>
  <line class="lead" x1="395.6" y1="144" x2="636" y2="144"/>
  <text class="badge you" x="652" y="141">you run it</text>
  <text class="cmd" x="652" y="161">task build:server, then bun run e2e</text>
  <polygon points="184.0,188 416.0,188 471.2,268 128.8,268" fill="var(--c-you2)"/>
  <text class="in" x="300" y="228">Browser tests</text>
  <text class="insub" x="300" y="248">EditorView, xterm, pdf.js</text>
  <line class="lead" x1="453.6" y1="228" x2="636" y2="228"/>
  <text class="badge you" x="652" y="225">you run it</text>
  <text class="cmd" x="652" y="245">bun run test:browser</text>
  <polygon points="126.0,272 474.0,272 529.2,352 70.8,352" fill="var(--c-ci1)"/>
  <text class="in" x="300" y="312">Node tests</text>
  <text class="insub" x="300" y="332">pure logic, no DOM</text>
  <line class="lead" x1="511.6" y1="312" x2="636" y2="312"/>
  <text class="badge ci" x="652" y="309">✓ runs in CI</text>
  <text class="cmd" x="652" y="329">bun run test</text>
  <polygon points="68.0,356 532.0,356 587.2,436 12.8,436" fill="var(--c-ci2)"/>
  <text class="in" x="300" y="396">Go tests</text>
  <text class="insub" x="300" y="416">services, fuzzing, benchmarks</text>
  <line class="lead" x1="569.6" y1="396" x2="636" y2="396"/>
  <text class="badge ci" x="652" y="393">✓ runs in CI</text>
  <text class="cmd" x="652" y="413">go test -race ./...</text>
  <text class="axis" x="20" y="34">▲ few, slow</text>
  <text class="axis" x="20" y="462">▼ many, fast</text>
</svg>
