<svg viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="r-amb-start" cx="50%" cy="50%" r="50%">
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.5"/>
      <stop offset="85%" stop-color="#70d6ff" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#70d6ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="r-ring-start" x1="120" y1="120" x2="392" y2="392" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="35%" stop-color="#70d6ff"/>
      <stop offset="70%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
  </defs>
  <!-- Atmospheric Lunar Corona Aura -->
  <circle cx="256" cy="256" r="210" fill="url(#r-amb-start)" filter="blur(32px)"/>
  
  <!-- Outer Precision Coordinate Ring -->
  <circle cx="256" cy="256" r="168" stroke="rgba(255,255,255,0.08)" stroke-width="2"/>
  
  <!-- 4 Cardinal Coordinate Notches -->
  <line x1="256" y1="76" x2="256" y2="92" stroke="rgba(112, 214, 255, 0.7)" stroke-width="2"/>
  <line x1="256" y1="420" x2="256" y2="436" stroke="rgba(112, 214, 255, 0.4)" stroke-width="2"/>
  <line x1="76" y1="256" x2="92" y2="256" stroke="rgba(112, 214, 255, 0.4)" stroke-width="2"/>
  <line x1="420" y1="256" x2="436" y2="256" stroke="rgba(112, 214, 255, 0.7)" stroke-width="2"/>

  <!-- Radiant Eclipse Rim -->
  <circle cx="256" cy="256" r="124" stroke="url(#r-ring-start)" stroke-width="7" filter="drop-shadow(0 0 16px #70d6ff)"/>
  
  <!-- Deep Void Core -->
  <circle cx="256" cy="256" r="120" fill="#161617"/>
  
  <!-- Polar Star Glint at Zenith -->
  <circle cx="256" cy="132" r="5" fill="#ffffff" filter="drop-shadow(0 0 10px #ffffff)"/>
  <line x1="256" y1="118" x2="256" y2="146" stroke="#ffffff" stroke-width="2"/>
  <line x1="242" y1="132" x2="270" y2="132" stroke="#ffffff" stroke-width="2"/>
</svg>
