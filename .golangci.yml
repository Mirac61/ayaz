version: "2"
linters:
  default: standard # errcheck, govet, ineffassign, staticcheck, unused
  settings:
    errcheck:
      exclude-functions:
        - (io.Closer).Close
        - (net.Conn).Close
        - (net.Listener).Close
        - (*os.File).Close
        - (*github.com/wailsapp/wails/v3/pkg/application.StreamConn).Close
        - (*os/exec.Cmd).Wait
        - os.Remove
        - os.RemoveAll
        - syscall.Kill
    staticcheck:
      # default set minus the two "use a tagged switch" style hints
      checks: ["all", "-ST1000", "-ST1003", "-ST1016", "-ST1020", "-ST1021", "-ST1022", "-QF1002", "-QF1003"]
  exclusions:
    rules:
      - path: _test\.go
        linters: [errcheck]
formatters:
  enable:
    - gofmt
